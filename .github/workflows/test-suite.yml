name: Test suite

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  test:
    name: Engine test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Determine test scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Push events reaching this job are already known to contain
          # at least one non-Markdown change because push uses paths-ignore.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MERGE_BASE=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")

          mapfile -d '' -t changed_files < <(
            git diff --no-renames --name-only -z "$MERGE_BASE" "$PR_HEAD_SHA"
          )

          echo "Changed files:"
          for file in "${changed_files[@]}"; do
            printf '  %q\n' "$file"
          done

          # Be conservative: an empty change set runs tests.
          if (( ${#changed_files[@]} == 0 )); then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_tests=false

          for file in "${changed_files[@]}"; do
            if [[ "$file" != *.md ]]; then
              run_tests=true
              break
            fi
          done

          echo "run_tests=$run_tests" >> "$GITHUB_OUTPUT"

      - name: Skip implementation test workload
        if: steps.scope.outputs.run_tests != 'true'
        run: echo "Markdown-only pull request; implementation tests are not required."

      - name: Install Nix
        if: steps.scope.outputs.run_tests == 'true'
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Run Go test suite
        if: steps.scope.outputs.run_tests == 'true'
        run: nix develop --command go test ./...

      - name: Run Go vet
        if: steps.scope.outputs.run_tests == 'true'
        run: nix develop --command go vet ./...

      - name: Run Python proof tests
        if: steps.scope.outputs.run_tests == 'true'
        run: nix develop --command python -m unittest discover -s scripts/tests -p 'test_*.py' -v
